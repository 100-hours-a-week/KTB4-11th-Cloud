# ALB 뒤에서 실제 클라이언트 IP를 복원한다.
# VPC(10.0.0.0/16) 안의 ALB가 보낸 X-Forwarded-For만 신뢰하므로,
# 인터넷에서 EIP로 직접 들어온 요청은 헤더를 위조해도 $remote_addr가 바뀌지 않는다.
set_real_ip_from 10.0.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 요청 추적 ID: 클라이언트(k6 등)가 보낸 X-Request-Id를 그대로 쓰고, 없으면 Nginx가 발급한다.
map $http_x_request_id $app_request_id {
    ""      $request_id;
    default $http_x_request_id;
}

# Backend로 넘길 X-Forwarded-For.
# real_ip 적용 후에는 $proxy_add_x_forwarded_for가 클라이언트 IP를 한 번 더 붙이므로
# ALB 경유 시 "클라이언트, ALB" 형태가 되도록 직접 구성한다.
map $http_x_forwarded_for $app_forwarded_for {
    ""      $remote_addr;
    default "$http_x_forwarded_for, $realip_remote_addr";
}

log_format access_json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"peer_ip":"$realip_remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$app_request_id",'
        '"amzn_trace_id":"$http_x_amzn_trace_id",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8080;
}

server {
    listen 80;
    server_name stock-spoon.com;
    access_log /var/log/nginx/access.log access_json;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name stock-spoon.com;
    access_log /var/log/nginx/access.log access_json;

    ssl_certificate /etc/letsencrypt/live/stock-spoon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock-spoon.com/privkey.pem;

    # ALB Target Group 헬스체크용. Nginx 자체 상태만 확인한다(Backend 장애와 분리).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # DNS가 ALB를 가리켜도 Let's Encrypt HTTP-01 갱신이 동작하도록 443에서도 제공한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $app_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $app_request_id;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $app_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $app_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
