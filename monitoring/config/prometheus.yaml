global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets: ["__DB_PRIMARY_PRIVATE_IP__:9100"]
        labels:
          node_role: primary
      - targets: ["__DB_PRIVATE_REPLICA_PRIVATE_IP__:9100"]
        labels:
          node_role: private-replica

  - job_name: mysql-primary
    scrape_interval: 5s
    static_configs:
      - targets: ["mysql-primary-exporter:9104"]
        labels:
          db_node: primary

  - job_name: mysql-private-replica
    scrape_interval: 5s
    static_configs:
      - targets: ["mysql-private-replica-exporter:9104"]
        labels:
          db_node: private-replica
          db_role: private-replica

  - job_name: proxysql-fargate
    scrape_interval: 5s
    dns_sd_configs:
      - names: ["proxysql-fargate.stockspoon-v2.internal"]
        type: A
        port: 6070
        refresh_interval: 15s
    relabel_configs:
      - target_label: proxy_role
        replacement: v2-fargate

  - job_name: db-fis-observer
    scrape_interval: 5s
    static_configs:
      - targets: ["db-fis-observer:9191"]
