apiVersion: 1
providers:
  - name: stockspoon
    orgId: 1
    folder: Stockspoon 운영
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/prod
  - name: stockspoon-dev
    orgId: 1
    folder: Stockspoon 개발
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards/dev
  - name: stockspoon-database
    orgId: 1
    folder: Database
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/db-migration
