auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  aws:
    region: ${AWS_REGION}
    bucketnames: ${LOKI_BUCKET}
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
ingester:
  wal:
    enabled: true
    dir: /loki/wal
limits_config:
  # Matches the former CloudWatch container log retention; FE logs live only here.
  retention_period: 720h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
analytics:
  reporting_enabled: false
