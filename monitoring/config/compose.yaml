name: ${COMPOSE_PROJECT_NAME:-stockspoon-v2-telemetry}

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=40GB
      - --web.enable-remote-write-receiver
    ports:
      - "${MONITORING_PRIVATE_IP:?set MONITORING_PRIVATE_IP}:9090:9090"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - /srv/stockspoon-telemetry/prometheus:/prometheus
    mem_limit: 3g
    logging: *logging

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      LOKI_BUCKET: ${LOKI_BUCKET:?set LOKI_BUCKET}
    ports:
      - "${MONITORING_PRIVATE_IP}:3100:3100"
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - /srv/stockspoon-telemetry/loki:/loki
    mem_limit: 4g
    logging: *logging

  tempo:
    # 2.x monolithic mode keeps this stack independent of Kafka.
    image: grafana/tempo:2.10.9
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      AWS_REGION: ${AWS_REGION}
      TEMPO_BUCKET: ${TEMPO_BUCKET:?set TEMPO_BUCKET}
    ports:
      - "${MONITORING_PRIVATE_IP}:4318:4318"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - /srv/stockspoon-telemetry/tempo:/var/tempo
    mem_limit: 4g
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "${MONITORING_PRIVATE_IP}:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:13000/}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - /srv/stockspoon-telemetry/grafana:/var/lib/grafana
      - /srv/stockspoon-telemetry/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 1g
    logging: *logging
