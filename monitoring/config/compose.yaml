name: ${COMPOSE_PROJECT_NAME:-stockspoon-v2-telemetry}

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=40GB
      - --web.enable-remote-write-receiver
    ports:
      - "${MONITORING_PRIVATE_IP:?set MONITORING_PRIVATE_IP}:9090:9090"
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - /srv/stockspoon-telemetry/prometheus:/prometheus
    mem_limit: 3g
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=72h
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /srv/stockspoon-telemetry/secrets/discord-webhook:/etc/alertmanager/secrets/discord-webhook:ro
      - /srv/stockspoon-telemetry/alertmanager:/alertmanager
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging: *logging

  mysql-primary-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
      - --config.my-cnf=/.my.cnf
      - --mysqld.address=${DB_PRIMARY_PRIVATE_IP:?set DB_PRIMARY_PRIVATE_IP}:3306
      - --mysqld.username=pmm
      - --tls.insecure-skip-verify
      - --web.listen-address=:9104
      - --collect.heartbeat
      - --collect.heartbeat.database=stockspoon
      - --collect.heartbeat.table=monitoring_heartbeat
      - --collect.heartbeat.utc
    volumes:
      - /srv/stockspoon-telemetry/secrets/db-migration/mysql-primary.cnf:/.my.cnf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging: *logging

  mysql-private-replica-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    command:
      - --config.my-cnf=/.my.cnf
      - --mysqld.address=${DB_PRIVATE_REPLICA_PRIVATE_IP:?set DB_PRIVATE_REPLICA_PRIVATE_IP}:3306
      - --mysqld.username=pmm
      - --tls.insecure-skip-verify
      - --web.listen-address=:9104
      - --collect.heartbeat
      - --collect.heartbeat.database=stockspoon
      - --collect.heartbeat.table=monitoring_heartbeat
      - --collect.heartbeat.utc
    volumes:
      - /srv/stockspoon-telemetry/secrets/db-migration/mysql-private-replica.cnf:/.my.cnf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    logging: *logging

  heartbeat-primary:
    image: percona/percona-toolkit:3.7.2
    restart: unless-stopped
    command:
      - pt-heartbeat
      - --update
      - --replace
      - --check-read-only
      - --utc
      - --interval=1
      - --database=stockspoon
      - --table=monitoring_heartbeat
      - h=${DB_PRIMARY_PRIVATE_IP:?set DB_PRIMARY_PRIVATE_IP},P=3306,u=heartbeat,F=/heartbeat.cnf,s=1
    volumes:
      - /srv/stockspoon-telemetry/secrets/db-migration/heartbeat.cnf:/heartbeat.cnf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging: *logging

  heartbeat-private-replica:
    image: percona/percona-toolkit:3.7.2
    restart: unless-stopped
    command:
      - pt-heartbeat
      - --update
      - --replace
      - --check-read-only
      - --utc
      - --interval=1
      - --database=stockspoon
      - --table=monitoring_heartbeat
      - h=${DB_PRIVATE_REPLICA_PRIVATE_IP:?set DB_PRIVATE_REPLICA_PRIVATE_IP},P=3306,u=heartbeat,F=/heartbeat.cnf,s=1
    volumes:
      - /srv/stockspoon-telemetry/secrets/db-migration/heartbeat.cnf:/heartbeat.cnf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging: *logging

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      LOKI_BUCKET: ${LOKI_BUCKET:?set LOKI_BUCKET}
    ports:
      - "${MONITORING_PRIVATE_IP}:3100:3100"
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - /srv/stockspoon-telemetry/loki:/loki
    mem_limit: 4g
    logging: *logging

  tempo:
    # 2.x monolithic mode keeps this stack independent of Kafka.
    image: grafana/tempo:2.10.9
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      AWS_REGION: ${AWS_REGION}
      TEMPO_BUCKET: ${TEMPO_BUCKET:?set TEMPO_BUCKET}
    ports:
      - "${MONITORING_PRIVATE_IP}:4318:4318"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - /srv/stockspoon-telemetry/tempo:/var/tempo
    mem_limit: 4g
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "${MONITORING_PRIVATE_IP}:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:13000/}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - /srv/stockspoon-telemetry/grafana:/var/lib/grafana
      - /srv/stockspoon-telemetry/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 1g
    logging: *logging
