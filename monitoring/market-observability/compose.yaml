services:
  market-ecs-exporter:
    build:
      context: ./market-observability
    restart: unless-stopped
    environment:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
    expose:
      - "9190"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
