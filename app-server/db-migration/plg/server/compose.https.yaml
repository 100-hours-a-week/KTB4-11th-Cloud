services:
  grafana:
    environment:
      GF_SERVER_ROOT_URL: "https://${GRAFANA_PUBLIC_IP:?run enable_grafana_https.sh first}/"
      GF_SECURITY_COOKIE_SECURE: "true"

  grafana-https:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: migration-grafana-https
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    ports:
      - "443:8444"
    volumes:
      - ./https/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./https/tls:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
