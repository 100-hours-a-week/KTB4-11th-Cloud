name: DB FIS observability validation

on:
  pull_request:
    branches: [main]
    paths:
      - "monitoring/config/prometheus-rules/db-fis.yml"
      - "monitoring/tests/db_fis.promql.yaml"
      - ".github/workflows/db-fis-validate.yml"
  push:
    branches: [main]
    paths:
      - "monitoring/config/prometheus-rules/db-fis.yml"
      - "monitoring/tests/db_fis.promql.yaml"
      - ".github/workflows/db-fis-validate.yml"

permissions:
  contents: read

jobs:
  prometheus-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test DB FIS rules in an isolated container
        run: >-
          docker run --rm --network=none --read-only
          --tmpfs /tmp:rw,nosuid,size=256m
          --entrypoint promtool -v "$PWD/monitoring:/work:ro"
          prom/prometheus:v3.15.0 test rules /work/tests/db_fis.promql.yaml
