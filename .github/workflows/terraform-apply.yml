name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "app-server/**"
      - "storage/**"
      - "iam/**"
      - "shared-infra/**"
      - "test-infra/**"
      - "messaging/**"
      - "redis/**"
      - "ecr/**"
      - "ecs/**"
      - "monitoring/**"
      - "ai-server/infra/**"
      - "ai-server/dev-infra/**"
      - "ai-server/dashboard/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/scripts/terraform_*.py"
      - "modules/**"
      - "scripts/tests/test_terraform_*.py"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  PYTHONUNBUFFERED: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

jobs:
  apply:
    name: Plan and apply affected Terraform roots
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test Terraform workflow helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_terraform_*.py' -v

      - name: Compile Python helper scripts
        run: python3 -m py_compile .github/scripts/terraform_*.py

      - name: Find last successful main deployment
        id: last-apply
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'terraform-apply.yml',
              branch: 'main',
              event: 'push',
              status: 'success',
              per_page: 1,
            });
            core.setOutput('sha', data.workflow_runs[0]?.head_sha ?? '');

      - name: Find affected roots and state consumers
        id: roots
        env:
          LAST_APPLIED_SHA: ${{ steps.last-apply.outputs.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/terraform_changes.py \
            --base "$LAST_APPLIED_SHA" --head "$CURRENT_SHA"
          python3 .github/scripts/terraform_roots.py changed-paths.txt >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        if: steps.roots.outputs.has_roots == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Prepare Terraform provider cache
        if: steps.roots.outputs.has_roots == 'true'
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Assume protected Terraform apply role
        if: steps.roots.outputs.has_roots == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: TerraformApply-${{ github.run_id }}

      - name: Apply affected roots in dependency order
        if: steps.roots.outputs.has_roots == 'true'
        env:
          ROOTS_JSON: ${{ steps.roots.outputs.roots }}
          TF_IN_AUTOMATION: "true"
        run: python3 .github/scripts/terraform_apply.py "$ROOTS_JSON"

      - name: Verify ECS deployments
        if: contains(fromJSON(steps.roots.outputs.roots || '[]'), 'ecs')
        env:
          AWS_REGION: ap-northeast-2
        run: |
          cluster="$(terraform -chdir=ecs output -raw cluster_name)"
          backend="$(terraform -chdir=ecs output -raw backend_service_name)"
          market_http="$(terraform -chdir=ecs output -json market_http_service_name | jq -r '. // empty')"

          services=("$backend")
          if [[ -n "$market_http" ]]; then
            services+=("$market_http")
          fi

          python3 .github/scripts/terraform_verify_ecs_services.py \
            --region "$AWS_REGION" \
            --cluster "$cluster" \
            "${services[@]}"
