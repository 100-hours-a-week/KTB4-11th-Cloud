name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "app-server/**"
      - "shared-infra/**"
      - "test-infra/**"
      - "messaging/**"
      - "redis/**"
      - "ai-server/infra/**"
      - "ai-server/dev-infra/**"
      - "ai-server/dashboard/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/scripts/terraform_*.py"

permissions:
  contents: read

concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

jobs:
  detect-roots:
    name: Detect affected Terraform roots
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.roots.outputs.matrix }}
      roots: ${{ steps.roots.outputs.roots }}
      has_roots: ${{ steps.roots.outputs.has_roots }}
    steps:
      - name: Check out main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find affected roots and state consumers
        id: roots
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git ls-files app-server shared-infra test-infra messaging redis ai-server > changed-paths.txt
          else
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > changed-paths.txt
          fi
          python3 .github/scripts/terraform_roots.py changed-paths.txt --all-if-affected >> "$GITHUB_OUTPUT"

  plan:
    name: Main plan ${{ matrix.root }}
    needs: detect-roots
    if: needs.detect-roots.outputs.has_roots == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-main-plan-${{ matrix.root }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-roots.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out main commit
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Assume read-only Terraform plan role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: TerraformMainPlan-${{ github.run_id }}

      - name: Create root plan summary
        env:
          ROOT: ${{ matrix.root }}
          TF_IN_AUTOMATION: "true"
        run: python3 .github/scripts/terraform_plan.py "$ROOT"

  apply:
    name: Apply approved Terraform plans
    needs: [detect-roots, plan]
    if: needs.detect-roots.outputs.has_roots == 'true' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: terraform-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out main commit
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Assume protected Terraform apply role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: TerraformApply-${{ github.run_id }}

      - name: Apply all roots in dependency order
        env:
          ROOTS_JSON: ${{ needs.detect-roots.outputs.roots }}
          TF_IN_AUTOMATION: "true"
        run: python3 .github/scripts/terraform_apply.py "$ROOTS_JSON"
