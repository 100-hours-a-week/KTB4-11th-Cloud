name: Terraform PR Plan

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  detect-roots:
    name: Detect affected Terraform roots
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.roots.outputs.matrix }}
      roots: ${{ steps.roots.outputs.roots }}
      has_roots: ${{ steps.roots.outputs.has_roots }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find affected roots and state consumers
        id: roots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          python3 .github/scripts/terraform_roots.py changed-paths.txt >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.root }}
    needs: detect-roots
    if: needs.detect-roots.outputs.has_roots == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-roots.outputs.matrix) }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Check formatting
        env:
          ROOT: ${{ matrix.root }}
        run: terraform -chdir="$ROOT" fmt -check -recursive

      - name: Initialize without AWS credentials
        env:
          ROOT: ${{ matrix.root }}
        run: terraform -chdir="$ROOT" init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        env:
          ROOT: ${{ matrix.root }}
        run: terraform -chdir="$ROOT" validate -no-color

  validate-workflow-scripts:
    name: Validate workflow helper scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Compile Python helper scripts
        run: python3 -m py_compile .github/scripts/terraform_*.py

  plan:
    name: Plan ${{ matrix.root }}
    needs: [detect-roots, validate]
    if: >-
      needs.detect-roots.outputs.has_roots == 'true' &&
      needs.validate.result == 'success' &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}-${{ matrix.root }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-roots.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Assume read-only Terraform plan role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: TerraformPlan-${{ github.run_id }}

      - name: Create root plan summary
        env:
          ROOT: ${{ matrix.root }}
          TF_IN_AUTOMATION: "true"
        run: python3 .github/scripts/terraform_plan.py "$ROOT"

      - name: Update root-specific pull request comment
        uses: actions/github-script@v9
        env:
          ROOT: ${{ matrix.root }}
          PLAN_SUMMARY_PATH: terraform-plan-summary.md
          PLAN_COMMIT: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = `<!-- terraform-plan:${process.env.ROOT} -->`;
            const summary = fs.readFileSync(process.env.PLAN_SUMMARY_PATH, 'utf8');
            const body = `${marker}\n${summary}\nPlan commit: \`${process.env.PLAN_COMMIT}\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  terraform-pr-ci:
    name: Terraform PR CI
    needs:
      - detect-roots
      - validate
      - validate-workflow-scripts
      - plan
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          DETECT_RESULT: ${{ needs.detect-roots.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SCRIPTS_RESULT: ${{ needs.validate-workflow-scripts.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_ROOTS: ${{ needs.detect-roots.outputs.has_roots }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Root detection did not succeed: $DETECT_RESULT"
            exit 1
          fi

          if [[ "$SCRIPTS_RESULT" != "success" ]]; then
            echo "Workflow script validation did not succeed: $SCRIPTS_RESULT"
            exit 1
          fi

          if [[ "$HAS_ROOTS" != "true" ]]; then
            echo "No Terraform roots changed; required CI checks passed."
            exit 0
          fi

          if [[ "$VALIDATE_RESULT" != "success" ]]; then
            echo "Terraform validation did not succeed: $VALIDATE_RESULT"
            exit 1
          fi

          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              if [[ "$PLAN_RESULT" != "success" ]]; then
                echo "Terraform plan did not succeed: $PLAN_RESULT"
                exit 1
              fi
              ;;
            *)
              if [[ "$PLAN_RESULT" != "skipped" && "$PLAN_RESULT" != "success" ]]; then
                echo "Terraform plan has an unexpected result: $PLAN_RESULT"
                exit 1
              fi
              echo "AWS plan is skipped for external contributors; validation passed."
              ;;
          esac
